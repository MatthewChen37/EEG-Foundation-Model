$schema: https://azuremlschemas.azureedge.net/latest/commandComponent.schema.json
type: command

name: hbngraphcreationjob
display_name: hbngraphcreationjob
description: Normalize and create graphs of HBN EEG data
tags:
  project: EEGFoundationModel
version: 1
outputs:
  data_dir:
    type: uri_folder
environment: azureml:PreprocessingEnvironment:29
code: .
command: |
  python GraphCreationJobHBN.py \
    --input_directory ${{outputs.data_dir}} \
    --version 256Hz