meta_params:
  experiment_name: MOBI_Downstream
  bands: ['delta', 'theta', 'alpha', 'beta', 'gamma']
  run_name: finetune_MOBI_downstream
  model_name: MENDR
  pretrained_autoencoder_path: "./checkpoint/pretrained_autoencoder_high_out_dim_12/autoencoder_weights.pth"
  pretrained_contextualizer_path: "./checkpoint/pretrained_contextualizer_tiny_raw/contextualizer_weights.pth"
  contextualizer_size: TINY
  log_system_metrics: False
  log_model_params_and_grads: False
  save_model: False
  save_final_model: False
dataset_params:
