meta_params:
  bands: ['delta', 'theta', 'alpha', 'beta', 'gamma']
  experiment_name: pretrain_tiny_contextualizer
  run_name: pretrain_tiny_contextualizer_train_size_${training_params.train_frac}_val_size_${training_params.val_frac}
  log_system_metrics: True
  log_contextualizer_params_and_grads: True
  save_model: True
  save_final_model: False
patch_encoder_params:
  num_channels: 19
  sampling_rate: 128
  super_patch_seconds: 2
  hop_length: 0.5
  delta_encoded_h: 4
  theta_encoded_h: 4
  alpha_encoded_h: 8
  beta_encoded_h: 16
  gamma_encoded_h: 32
  # high_encoded_h: 64
  n_gnn_transformer_layers: 2
training_params:
  input_dir: /storage/ice1/shared/bmed6780/mip_group_6/ef/TUH-128Hz 
  train_frac: 0.005
  val_frac: 0.005
  random_seed: 42
  learning_rate: 0.001
  l2_weight_decay: 0.0005
  batch_size: 128
  epochs: 1
  T_max: 1
  eta_min: 1.0e-7
  scheduler_after_batch: False
  ckpt_dir: ./checkpoint
  num_workers: 16
  gradient_clip_value: 1e7