meta_params:
  bands: ['delta', 'theta', 'alpha', 'beta', 'gamma']
  experiment_name: train_autoencoder
  run_name: test
  log_system_metrics: True
patch_encoder_params:
  num_channels: 19
  sampling_rate: 128
  super_patch_seconds: 5
  hop_length: 0.5
  delta_encoded_h: 19
  theta_encoded_h: 19
  alpha_encoded_h: 38
  beta_encoded_h: 76
  gamma_encoded_h: 114
  # high_encoded_h: 152
  n_gnn_transformer_layers: 2
training_params:
