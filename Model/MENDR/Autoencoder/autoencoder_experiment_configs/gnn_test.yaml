meta_params:
  bands: ['delta', 'theta', 'alpha', 'beta', 'gamma']
  experiment_name: train_autoencoder
  run_name: train_autoencoder_train_size_${training_params.train_frac}_val_size_${training_params.val_frac}_layers_${patch_encoder_params.n_gnn_transformer_layers}_default
  log_system_metrics: True
  log_model_params_and_grads: False
  save_model: False
  save_final_model: True
  num_recons: 4
patch_encoder_params:
  num_channels: 19
  sampling_rate: 128
  super_patch_seconds: 2
  hop_length: 0.5
  delta_encoded_h: 19
  theta_encoded_h: 19
  alpha_encoded_h: 38
  beta_encoded_h: 76
  gamma_encoded_h: 152
  # high_encoded_h: 64
  n_gnn_transformer_layers: 6
  hidden_encoded_ratio: 2
training_params:
  input_dir: /storage/ice1/shared/bmed6780/mip_group_6/ef/TUH-128Hz 
  train_frac: 0.1
  val_frac: 0.01
  random_seed: 42
  learning_rate: 1.0e-3
  l2_weight_decay: 0.0005
  batch_size: 128
  epochs: 10
  T_max: 10
  eta_min: 1.0e-7
  scheduler_after_batch: False
  ckpt_dir: ./checkpoint
  num_workers: 32