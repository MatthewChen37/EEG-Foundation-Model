$schema: https://azuremlschemas.azureedge.net/latest/commandComponent.schema.json
type: command

name: tuhprocessingjob
display_name: tuhprocessingjob
description: Preprocess and Epoch TUH EEG data
tags:
  project: EEGFoundationModel
version: 1
inputs:
  input_dir:
    type: uri_folder
outputs:
  output_dir:
    type: uri_folder
environment: azureml:PreprocessingEnvironment:28
code: .
command: |
  python TUHProcessingJob.py \
    --input_dir ${{inputs.input_dir}} \
    --output_dir ${{outputs.output_dir}}