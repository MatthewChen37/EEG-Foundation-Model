$schema: https://azuremlschemas.azureedge.net/latest/commandComponent.schema.json
type: command

name: hbnprocessingjob
display_name: hbnprocessingjob
description: Preprocess and Epoch HBN EEG data
tags:
  project: EEGFoundationModel
version: 1
inputs:
  input_dir:
    type: uri_folder
outputs:
  output_dir:
    type: uri_folder
environment: azureml:PreprocessingEnvironment:6
code: .
command: |
  python HBNProcessingJob.py \
    --input_dir ${{inputs.input_dir}} \
    --output_dir ${{outputs.output_dir}} \
    --version 128Hz