$schema: https://azuremlschemas.azureedge.net/latest/commandComponent.schema.json
type: command

name: tuhconvert
display_name: tuhconvert
description: Convert TUH EEG data to BIDS format
tags:
  project: EEGFoundationModel
version: 1
inputs:
  input_dir:
    type: uri_folder
outputs:
  output_dir:
    type: uri_folder
environment: azureml:PreprocessingEnvironment:@latest
code: .
command: |
  python convertTUHtoBIDS.py \
    --input_dir ${{inputs.input_dir}} \
    --output_dir ${{outputs.output_dir}}